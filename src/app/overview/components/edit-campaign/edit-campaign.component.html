<div>
  <form [formGroup]="campaignForm" (ngSubmit)="save()">
    <div class="form-group">
      <input type="text" id="name" formControlName="name" required>
      <label for="name">Name *</label>
    </div>
    <div class="form-group">
      <input type="text" id="date" formControlName="date" required>
      <label for="name">Datum *</label>
    </div>
    @if (props.xp) {
      <div class="form-group">
        <input type="text" id="xp" formControlName="xp">
        <label for="xp">Abenteuerpunkte</label>
      </div>
    }
    @if (props.crewcount) {
      <div class="form-group">
        <input type="number" id="crewcount" formControlName="crewcount">
        <label for="crewcount">Mannschaft</label>
      </div>
    }
    @if (props.staminaReduction) {
      <div class="form-group">
        <input type="number" id="staminaReduction" formControlName="staminaReduction">
        <label for="staminaReduction">Ausdauer Malus</label>
      </div>
    }
    @if (props.ship) {
      <div class="form-group">
        <input type="text" id="ship" formControlName="ship">
        <label for="ship">Schiff</label>
      </div>
    }
    @if (props.captain) {
      <div class="form-group">
        <input type="text" id="captain" formControlName="captain">
        <label for="captain">Kapitän</label>
      </div>
    }
    <button type="submit" class="btn" [disabled]="!campaignForm.valid">
      Speichern
    </button>
  </form>
</div>
