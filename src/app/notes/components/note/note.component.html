@if (note) {
  <div class="note-detail">
    <app-markdown class="note-content" [text]="note.content"></app-markdown>
    <app-backlinks entityType="note" [entityId]="note.id"></app-backlinks>
    <div class="note-actions">
      <button type="button" class="btn" (click)="editNote()">
        Bearbeiten
      </button>
    </div>
  </div>
}

@if (!note) {
  <div class="note-not-found">
    <p>Notiz nicht gefunden</p>
  </div>
}
