<div>
  <form [formGroup]="noteForm" (ngSubmit)="save()">
    <div class="form-group">
      <input type="text" id="title" formControlName="title">
      <label for="title">Titel</label>
    </div>

    <div class="form-group">
      <input type="text" id="category" formControlName="category">
      <label for="category">Kategorie</label>
    </div>

    <div class="form-group">
      <app-rich-text-editor inputId="content" formControlName="content" required></app-rich-text-editor>
      <label for="content">Inhalt *</label>
    </div>

    <button type="submit" class="btn" [disabled]="!noteForm.valid">
      Speichern
    </button>

    @if (props.id) {
      <div class="locked-input">
        <app-unlock-button (toggle)="toggleDelete()"></app-unlock-button>
        <button type="button" class="btn" (click)="delete()" [disabled]="deleteDisabled">
          Löschen
        </button>
      </div>
    }
  </form>
</div>
