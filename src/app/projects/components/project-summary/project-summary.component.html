<div
  class="wrapper box"
  [ngClass]="{'completed': currentPoints >= requiredPoints}"
  (click)="editProject(project)"
  >
  <div class="name">{{project.name}}</div>
  <app-progress-bar [percentage]="percentage" [markers]="markers"></app-progress-bar>
  <div class="milestones">
    @for (milestone of project.milestones; track milestone; let i = $index) {
      <div class="milestone"
        [ngClass]="{'open': currentPoints < milestone.requiredPoints}"
        >
        <fa-icon [icon]="faStar" [fixedWidth]="true"></fa-icon>
        <div class="index">{{i+1}}</div>
        {{milestone.description}}
      </div>
    }
    <div class="milestone" [ngClass]="{'open': currentPoints < requiredPoints}">
      <fa-icon [icon]="faAward" [fixedWidth]="true"></fa-icon>
      {{project.benefit}}
    </div>
  </div>
  <div class="requirements">
    @for (requirement of project.requirements; track requirement) {
      <div class="requirement">
        {{getRequirementString(requirement)}}
      </div>
    }
    Interval: {{project.interval}}
  </div>
  <app-access-indicator [item]="project"></app-access-indicator>
</div>
