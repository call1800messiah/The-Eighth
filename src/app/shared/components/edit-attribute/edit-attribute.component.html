<div>
  <form [formGroup]="attributeForm" (ngSubmit)="save()">
    @if(!props.attribute) {
      <div class="form-group">
        <select formControlName="type" id="type">
          @for (att of allowedAttributes | keyvalue; track att) {
            <option [value]="att.key">{{ att.value }}</option>
          }
        </select>
        <label for="type">Typ</label>
      </div>
    } @else {
      <input type="hidden" formControlName="type" value="{{props.attribute.type}}">
    }

    <div [ngClass]="{'locked-input': props.attribute}">
      @if (props.attribute) {
        <app-unlock-button (toggle)="toggleMax()"></app-unlock-button>
      }

      <div class="form-group">
        <input
          id="max"
          formControlName="max"
          type="number"
          step="1"
          required
          appSelectOnFocus
          >
        <label for="max">Maximum</label>
      </div>
    </div>

    <div class="form-group">
      <input
        id="current"
        formControlName="current"
        type="number"
        step="1"
        required
        appSelectOnFocus
        appFocusOnInit
        >
      <label for="current">Aktuell</label>
    </div>

    <button type="submit" class="btn" [disabled]="!attributeForm.valid">
      Speichern
    </button>

    @if (props.attribute && !props.altCollection) {
      <div class="locked-input">
        <app-unlock-button (toggle)="toggleDelete()"></app-unlock-button>
        <button type="button" class="btn" (click)="delete()" [disabled]="deleteDisabled">
          Löschen
        </button>
      </div>
    }
  </form>
</div>
