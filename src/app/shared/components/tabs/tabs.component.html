<div class="tabs">
  @for (panel of tabPanels; track panel) {
    <button
      type="button"
      class="tab-btn"
      [class.active]="activeTabId === panel.id"
      (click)="selectTab(panel.id)"
      >
      {{ panel.label }}
    </button>
  }
</div>
<div class="tab-content">
  <ng-content></ng-content>
</div>
