<div class="wrapper" (click)="goToPerson()">
  <div class="image">
    @if (person.image) {
      <img appImageFallback [src]="priority ? person.image : person.imageThumb" [alt]="person.name" />
    }
  </div>

  @if (!person.image) {
    <div class="default">{{person.name.substr(0,1)}}</div>
  }
</div>
