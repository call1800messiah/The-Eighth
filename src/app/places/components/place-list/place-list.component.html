<app-container width="medium">
  <app-top-bar-filter placeholder="z.B. Name" (filterChanged)="onFilterChanged($event)" [text]="initialFilterText">
    <button type="button" class="btn-icon" (click)="showAddDialog()">
      <fa-icon [icon]="faPlus" [fixedWidth]="true"
      title="Ort hinzufügen"></fa-icon>
    </button>
  </app-top-bar-filter>

  @if (filterText.value === '') {
    <ul class="places unstyled-list">
      @for (place of places$ | async; track place) {
        <app-place-summary
          [place]="place"
          [showParts]="true"
        ></app-place-summary>
      }
    </ul>
  }

  @if (filterText.value !== '') {
    <ul class="filterted-places unstyled-list">
      @for (place of filteredPlaces$ | async; track place) {
        <app-place-summary
          [place]="place"
          [showParts]="false"
        ></app-place-summary>
      }
    </ul>
  }
</app-container>
