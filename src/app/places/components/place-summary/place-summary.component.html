<li class="place">
  <app-access-indicator [item]="place"></app-access-indicator>

  <div class="type">{{placeTypes[place.type]}}</div>

  <a class="name" [routerLink]="[place.id]">
    {{place.name}}
    @if (place.status === 'draft') {
      <span class="draft-tag">Entwurf</span>
    }
  </a>

  @if (place.parts && showParts) {
    <ul class="parts unstyled-list">
      @for (part of place.parts; track part) {
        <app-place-summary
          [place]="part"
          [showParts]="showParts"
        ></app-place-summary>
      }
    </ul>
  }
</li>
