<div class="app" [ngClass]="{'popover-open': popoverOpen$ | async}">
  <app-header></app-header>

  <div class="page" [ngClass]="{'sidebar-closed': !(sidebarOpen$ | async)}">
    @if ((isLoggedIn$ | async)) {
      <app-sidebar ></app-sidebar>
    }

    <main>
      <router-outlet></router-outlet>
    </main>
  </div>

  @if (isLoggedIn$ | async) {
    <app-footer></app-footer>
    <!-- GM-only spotlight tracker; renders nothing for players -->
    <app-story-beat-bar></app-story-beat-bar>
  }

  <app-popover></app-popover>
</div>
