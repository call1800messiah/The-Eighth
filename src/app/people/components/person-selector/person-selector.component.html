<form [formGroup]="personForm">
  <div class="form-group">
    <select formControlName="selectedPersonId" id="selectedPersonId">
      @for (person of people$ | async; track person) {
        <option [ngValue]="person.id">{{person.name}}</option>
      }
    </select>
    <label for="selectedPersonId">Werte für</label>
  </div>
</form>
