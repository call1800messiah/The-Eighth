@if (attributes$ && person) {
  <div class="values">
    <app-attributes
      [attributeValues$]="attributes$"
      [canEdit]="isOwnerOrCan('editStats')"
      [personId]="person.id"
    ></app-attributes>
    <app-bar-attributes
      [attributeValues$]="attributes$"
      [canEdit]="isOwnerOrCan('editHitPoints')"
      [personId]="person.id"
      >
    </app-bar-attributes>
  </div>
}

@if (person) {
  <app-capability-list [person]="person"></app-capability-list>
}
