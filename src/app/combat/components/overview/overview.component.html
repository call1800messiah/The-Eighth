<div class="top-bar clearfix">
  <div class="form-group">
    <input id="newCombatant" type="text" [(ngModel)]="newCombatant">
    <label for="newCombatant">Kämpfername</label>
  </div>

  <button type="button" class="btn-icon btn-add" (click)="addCombatant()">
    <fa-icon [icon]="faPlus" [fixedWidth]="true"
    title="Kämpfer hinzufügen"></fa-icon>
  </button>

  <button type="button" class="btn-icon btn-people" (click)="showAddPersonDialog()">
    <fa-icon [icon]="faUsers" [fixedWidth]="true"
    title="Person als Kämpfer hinzufügen"></fa-icon>
  </button>

  <button type="button" class="btn-icon" [ngClass]="{'active': showAsList && !showMap}" (click)="toggleDisplayStyle()">
    <fa-icon [icon]="faList" [fixedWidth]="true"
    title="Anzeigestil wechseln"></fa-icon>
  </button>

  <button type="button" class="btn-icon btn-map" [ngClass]="{'active': showMap}" (click)="toggleMap()">
    <fa-icon [icon]="faMap" [fixedWidth]="true"
    title="Kampfkarte"></fa-icon>
  </button>
</div>

@if (showMap) {
  <app-combat-map [combatants]="combatants$ | async"></app-combat-map>
}


@if (!showMap && !showAsList) {
  <app-box-grid>
    @for (combatant of combatants$ | async; track combatant) {
      <app-combatant [combatant]="combatant"></app-combatant>
    }
  </app-box-grid>
}

@if (!showMap && showAsList) {
  <div>
    @for (combatant of combatants$ | async; track combatant) {
      <app-combatant [combatant]="combatant" [showAsList]="true"></app-combatant>
    }
  </div>
}
