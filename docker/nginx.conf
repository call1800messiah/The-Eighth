worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Cache hashed assets (Angular content-hashed filenames)
        location ~* "\.[0-9a-f]{16,}\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Supabase API proxy - forwards to the Envoy gateway over the
        # supabase Docker network (see deploy/supabase/docker-compose.yml).
        # Same-origin from the browser: no CORS, no mixed content, and
        # Supabase itself is never given a public hostname or port.
        #
        # Only exercised when the app was built with an empty
        # NG_APP_SUPABASE_URL (environment.prod.ts then resolves calls to
        # window.location.origin). Local/dev builds bake in a direct URL and
        # never hit these routes - the resolver below just keeps nginx from
        # failing to start when "envoy" isn't a reachable hostname in that
        # case (e.g. local dev, which doesn't join supabase).
        #
        # proxy_pass deliberately has NO trailing URI here: with a variable
        # upstream, nginx does not prefix-rewrite the path (it would instead
        # send the same literal suffix for every request, e.g. always
        # "/auth/v1/" instead of "/auth/v1/token?grant_type=..."). Omitting
        # the URI forwards the original request URI unchanged, which is what
        # Envoy expects since its own routes match these same prefixes.
        resolver 127.0.0.11 valid=10s;
        set $supabase_upstream envoy:8000;

        location /rest/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /realtime/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /storage/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        # Angular SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
