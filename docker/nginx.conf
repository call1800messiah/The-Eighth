worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    server_tokens off;

    # Nginx Proxy Manager terminates TLS and reaches this container from a
    # Docker network, so every request would otherwise appear to come from
    # NPM. Trust X-Forwarded-For only from Docker's address range; a LAN
    # client talking to the published port directly cannot spoof it.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Slows password guessing against GoTrue. Keyed on the real client IP
    # from above. A whole group playing behind one home router shares it,
    # hence the burst.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    limit_req_status 429;

    # Rendered images (StorageService.getImageURL, #77): imgproxy resizes and
    # converts each one on request, so keep the result. Upload names are
    # unique, so a render never shows outdated content; the short lifetime is
    # for removed files, which would otherwise stay reachable from the cache
    # (the render endpoint needs no login). The cache lives in the container;
    # a redeploy only costs re-rendering.
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m
                     max_size=1g inactive=1d use_temp_path=off;

    # Every render costs imgproxy CPU and anyone can ask for one. Hits count
    # too, so the burst has to cover a list page full of avatars and a whole
    # group behind one router.
    limit_req_zone $binary_remote_addr zone=image_render:10m rate=20r/s;

    # imgproxy picks WebP from the Accept header (IMGPROXY_AUTO_WEBP), so the
    # cache keeps one copy for browsers that accept WebP and one for others.
    map $http_accept $image_variant {
        ~*image/webp webp;
        default      orig;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Content-hashed build output: the esbuild builder names files
        # `main-FJM232XD.js`, `chunk-D1xpxn-E.js` (8 characters, mixed case,
        # `-` and `_`), and puts files referenced from CSS under media/.
        # Deliberately not a looser pattern: files under assets/ are not
        # hashed and must not be cached for a year.
        location ~ "^/(main|polyfills|styles|chunk)-[A-Za-z0-9_-]{8}\.(js|css)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        location ~ "^/media/" {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # The counterpart to the above: index.html names the current chunks,
        # so it must be revalidated on every load. A stale copy would ask for
        # chunks the next deploy has already removed. SPA routes reach this
        # block too, via the try_files fallback below.
        location = /index.html {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
        }

        # Supabase API proxy - forwards to the Envoy gateway over the
        # supabase Docker network (see deploy/supabase/docker-compose.yml).
        # Same-origin from the browser: no CORS, no mixed content, and
        # Supabase itself is never given a public hostname or port.
        #
        # Only exercised when the app was built with an empty
        # NG_APP_SUPABASE_URL (environment.prod.ts then resolves calls to
        # window.location.origin). Local/dev builds bake in a direct URL and
        # never hit these routes - the resolver below just keeps nginx from
        # failing to start when "envoy" isn't a reachable hostname in that
        # case (e.g. local dev, which doesn't join supabase).
        #
        # proxy_pass deliberately has NO trailing URI here: with a variable
        # upstream, nginx does not prefix-rewrite the path (it would instead
        # send the same literal suffix for every request, e.g. always
        # "/auth/v1/" instead of "/auth/v1/token?grant_type=..."). Omitting
        # the URI forwards the original request URI unchanged, which is what
        # Envoy expects since its own routes match these same prefixes.
        resolver 127.0.0.11 valid=10s;
        set $supabase_upstream envoy:8000;

        location /rest/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoints that check a password or send mail. Regex locations win
        # over the /auth/v1/ prefix below.
        location ~ ^/auth/v1/(token|recover|otp|verify|magiclink)$ {
            limit_req zone=auth_login burst=20 nodelay;
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /realtime/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Only the public render endpoint: its responses are the same for
        # every viewer. Authenticated renders and plain objects go through the
        # block below, uncached. Upstream Cache-Control (3 days, from the
        # upload) is ignored for nginx's own cache in favour of 10 minutes,
        # how long a removed image can still be served; browsers still get it.
        #
        # The key holds only the transform options storage reads, so junk
        # query parameters cannot force a fresh render each.
        location /storage/v1/render/image/public/ {
            limit_req zone=image_render burst=300 nodelay;
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache images;
            proxy_cache_key "$image_variant$uri?w=$arg_width&h=$arg_height&r=$arg_resize&q=$arg_quality&f=$arg_format";
            proxy_cache_valid 200 10m;
            proxy_ignore_headers Cache-Control Expires Vary;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating;

            proxy_hide_header Vary;
            add_header Vary Accept always;
            add_header X-Cache-Status $upstream_cache_status always;
            include /etc/nginx/security-headers.conf;
        }

        location /storage/v1/ {
            proxy_pass http://$supabase_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        # MCP server (mcp/, same stack). Claude reaches it at /mcp, and runs
        # its OAuth flow under /mcp/oauth/ and the two /.well-known/ documents
        # below. Resolved per request like the Supabase upstream, so nginx
        # still starts when the mcp container is not running.
        #
        # X-Forwarded-For is replaced with the client address real_ip worked
        # out above, so the server's own rate limits see one trustworthy hop.
        set $mcp_upstream the-eighth-mcp:3000;

        location = /mcp {
            proxy_pass http://$mcp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300;
            client_max_body_size 1m;
        }

        # Checks a GM's password.
        location = /mcp/oauth/login {
            limit_req zone=auth_login burst=20 nodelay;
            proxy_pass http://$mcp_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 16k;
        }

        location /mcp/ {
            proxy_pass http://$mcp_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 64k;
        }

        location ~ ^/\.well-known/oauth-(authorization-server|protected-resource)(/.*)?$ {
            proxy_pass http://$mcp_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Angular SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
