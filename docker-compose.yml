# Docker Compose for TheEighth (Angular + Supabase)
#
# Usage:
#   1. cp docker/.env.example .env    (adjust values)
#   2. docker compose up --build -d
#   3. Open http://localhost (or APP_PORT)
#
# Data population:
#   docker compose exec -T db psql -U postgres < backup.sql

services:
  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: supabase/postgres:15.6.1.143
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Fresh-volume init runs roles + jwt + 11 migrations before Postgres
      # accepts TCP; without this grace window those early probe failures
      # mark the container unhealthy and abort the whole stack.
      start_period: 90s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - generate with openssl rand -base64 64}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      # Ensure the `postgres` superuser exists before any 99-* script or the
      # healthcheck references it (the image bootstraps as supabase_admin).
      - ./docker/db/00-init-superuser.sh:/docker-entrypoint-initdb.d/00-init-superuser.sh:ro
      # Role passwords and JWT config (run after via alphabetical ordering)
      - ./docker/db/roles.sh:/docker-entrypoint-initdb.d/99-roles.sh:ro
      - ./docker/db/jwt.sh:/docker-entrypoint-initdb.d/99-jwt.sh:ro
      # Application migrations (mounted into init-scripts/ so the entrypoint processes them)
      - ./supabase/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/init-scripts/100-001_initial_schema.sql:ro
      - ./supabase/migrations/002_rls_policies.sql:/docker-entrypoint-initdb.d/init-scripts/100-002_rls_policies.sql:ro
      - ./supabase/migrations/003_storage_buckets.sql:/docker-entrypoint-initdb.d/init-scripts/100-003_storage_buckets.sql:ro
      - ./supabase/migrations/004_info_box_access.sql:/docker-entrypoint-initdb.d/init-scripts/100-004_info_box_access.sql:ro
      - ./supabase/migrations/005_timeline_access.sql:/docker-entrypoint-initdb.d/init-scripts/100-005_timeline_access.sql:ro
      - ./supabase/migrations/006_combat_access.sql:/docker-entrypoint-initdb.d/init-scripts/100-006_combat_access.sql:ro
      - ./supabase/migrations/007_rules_metadata.sql:/docker-entrypoint-initdb.d/init-scripts/100-007_rules_metadata.sql:ro
      - ./supabase/migrations/008_document_access_owner_policies.sql:/docker-entrypoint-initdb.d/init-scripts/100-008_document_access_owner_policies.sql:ro
      - ./supabase/migrations/009_realtime_publication.sql:/docker-entrypoint-initdb.d/init-scripts/100-009_realtime_publication.sql:ro
      - ./supabase/migrations/010_document_access_replica_identity.sql:/docker-entrypoint-initdb.d/init-scripts/100-010_document_access_replica_identity.sql:ro
      - ./supabase/migrations/011_person_attributes_realtime.sql:/docker-entrypoint-initdb.d/init-scripts/100-011_person_attributes_realtime.sql:ro
      - ./supabase/migrations/012_restrict_directory_to_authenticated.sql:/docker-entrypoint-initdb.d/init-scripts/100-012_restrict_directory_to_authenticated.sql:ro

  # ── Role-password sync (idempotent, runs every deploy) ──────────────────────
  # Decouples role-password setup from the one-shot initdb hook so that changing
  # POSTGRES_PASSWORD no longer leaves the service roles stuck on the old value.
  # Dependent services gate on this completing successfully, so a wrong password
  # fails loudly here instead of surfacing as crash-loops / Kong DNS errors.
  db-init:
    image: supabase/postgres:15.6.1.143
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/db/init-roles.sh:/init/init-roles.sh:ro
    entrypoint: ["sh", "/init/init-roles.sh"]

  # ── API Gateway ─────────────────────────────────────────────────────────────
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # API keys Kong accepts (rendered into kong.yml by the entrypoint below).
      SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY must be set}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY must be set}
    volumes:
      - ./docker/kong.yml:/home/kong/temp.yml:ro
    # Expand SUPABASE_ANON_KEY / SUPABASE_SERVICE_KEY into the declarative
    # config before Kong starts. The source file is mounted read-only; the
    # rendered copy lives at ~/kong.yml inside the container.
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

  # ── PostgREST ───────────────────────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"

  # ── Auth (GoTrue) ──────────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.164.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SITE_URL:-http://localhost}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost}
      GOTRUE_URI_ALLOW_LIST: ""
      # Accounts are provisioned by the migration script via the admin API
      # (service_role bypasses this flag). No public self-registration.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  # ── Realtime ────────────────────────────────────────────────────────────────
  realtime:
    image: supabase/realtime:v2.33.58
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${DB_ENC_KEY:?DB_ENC_KEY must be set - generate with openssl rand -hex 16}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set - generate with openssl rand -base64 48}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"

  # ── Storage API ─────────────────────────────────────────────────────────────
  storage:
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      IS_MULTITENANT: "false"
    volumes:
      - storage-data:/var/lib/storage

  # ── PG Meta (required by Studio) ───────────────────────────────────────────
  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # ── Studio ──────────────────────────────────────────────────────────────────
  studio:
    image: supabase/studio:2026.03.23-sha-b7847b7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    ports:
      # Studio has no authentication of its own and connects to the DB as
      # supabase_admin. Loopback-only: reach it over an SSH tunnel, e.g.
      #   ssh -L 3001:127.0.0.1:3001 user@server
      - "127.0.0.1:${STUDIO_PORT:-3001}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Default Organization
      DEFAULT_PROJECT_NAME: TheEighth
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SITE_URL:-http://localhost}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres

  # ── Angular App (nginx) ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NG_APP_TENANT: ${NG_APP_TENANT:-the-eighth}
        NG_APP_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

  # ── Migration Services (on-demand via `docker compose run --rm <service>`) ──

  migrate:
    image: node:20-alpine
    profiles: ["migration"]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
      - ./src/assets:/app/src/assets:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    working_dir: /app
    entrypoint: ["sh", "-c", "npm ci --ignore-scripts && npx tsx scripts/transform-and-migrate.ts"]

  migrate-storage:
    image: node:20-alpine
    profiles: ["migration"]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/export:/app/data/export:ro
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    working_dir: /app
    entrypoint: ["sh", "-c", "npm ci --ignore-scripts && npx tsx scripts/migrate-storage.ts"]

  migrate-validate:
    image: node:20-alpine
    profiles: ["migration"]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/export:/app/data/export:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    working_dir: /app
    entrypoint: ["sh", "-c", "npm ci --ignore-scripts && npx tsx scripts/validate-migration.ts"]

volumes:
  db-data:
  storage-data:
